
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Blackjack</title>

    <link rel="stylesheet" href="blackjack.css">
</head>

<body>

    <header class="top-bar">
        <a href="../../index.html" class="back-button">
            ← Back to Home
        </a>

        <h1>BLACKJACK</h1>

        <div class="header-placeholder"></div>
    </header>

    <main class="game-container">

        <!-- Dealer section -->

        <section class="player-area">

            <div class="player-info">
                <h2>Dealer</h2>
                <span id="dealer-score" class="score">?</span>
            </div>

            <div id="dealer-cards" class="cards">
            </div>

        </section>


        <div id="game-message" class="game-message">
            Your turn. Hit or stand?
        </div>


        <!-- Player section -->

        <section class="player-area">

            <div class="player-info">
                <h2>You</h2>
                <span id="player-score" class="score">0</span>
            </div>

            <div id="player-cards" class="cards">
            </div>

        </section>


        <!-- Controls -->

        <section class="controls">
            <div class="bankroll-panel">
                <div class="bankroll-item">
                    <span>Balance</span>
                    <strong id="bankroll">€100</strong>
                </div>

                <div class="bankroll-item">
                    <label for="bet-amount">Your bet</label>
                    <input
                        id="bet-amount"
                        type="number"
                        min="10"
                        step="10"
                        value="10"
                    >
                    <small>Minimum bet: €10</small>

                    <button id="bet-button">Bet</button>
                </div>

                <div class="bankroll-item">
                    <span>Session high score</span>
                    <strong id="session-high-score">€100</strong>
                </div>
            </div>           

            <button id="hit-button" class="game-button">
                Hit
            </button>

            <button id="stand-button" class="game-button secondary">
                Stand
            </button>

            <button id="new-game-button" class="game-button new-game">
                New Game
            </button>

        </section>

        <p class="rules">
            Get as close to 21 as possible without going over.
            Dealer stands on 17.
        </p>

    </main>

    <script src="blackjack.js"></script>

</body>
</html>
